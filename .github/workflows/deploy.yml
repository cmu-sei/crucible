name: Release and Deploy Docs

on:
  push:
    branches: ["main"]

permissions:
  contents: read

# gh-deploy force-pushes the gh-pages branch; never run two at once.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  lint:
    uses: ./.github/workflows/lint.yml

  build-and-deploy:
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and push gh-pages
    steps:
      - uses: actions/checkout@v7

      - name: Determine base release tag
        id: release_tag
        run: echo "value=$(date +'%m.%d.%Y')" >> "$GITHUB_OUTPUT"

      - name: Compute release tag with index if needed
        id: tag_with_index
        uses: actions/github-script@v9
        env:
          BASE_TAG: ${{ steps.release_tag.outputs.value }}
        with:
          result-encoding: string
          script: |
            const baseTag = process.env.BASE_TAG;
            const regex = new RegExp(`^${baseTag.replace(/\./g, '\\.')}(?:-(\\d+))?$`);
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });

            let maxIndex = 0;
            let sawMatch = false;
            for (const release of releases) {
              const tag = release.tag_name;
              const match = tag ? regex.exec(tag) : null;
              if (!match) continue;
              sawMatch = true;
              const idx = match[1] ? parseInt(match[1], 10) : 0;
              if (!Number.isNaN(idx)) {
                maxIndex = Math.max(maxIndex, idx);
              }
            }

            const nextIndex = maxIndex + 1;
            const tagName = `${baseTag}-${nextIndex}`;
            core.info(`Using tag ${tagName} (base ${baseTag}; max existing index ${sawMatch ? maxIndex : 'none'}).`);
            core.setOutput('tag_name', tagName);

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag_with_index.outputs.tag_name }}
        run: gh release create "$TAG" --title "$TAG" --target "$GITHUB_SHA" --generate-notes

      # Deploy to GH Pages
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy to GitHub Pages
        run: mkdocs gh-deploy --force --clean --verbose
