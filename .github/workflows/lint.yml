name: Lint and Build Docs

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint and build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Vale
        env:
          GH_TOKEN: ${{ github.token }}
          VALE_VERSION: v3.24.0
        run: |
          gh release download "$VALE_VERSION" --repo errata-ai/vale --pattern "vale_*_Linux_64-bit.tar.gz" -O vale.tar.gz
          tar -xzf vale.tar.gz vale

      - name: Run Vale
        run: ./vale .

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Run markdownlint
        run: npx --yes markdownlint-cli2@0.24.0 "**/*.md"

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build docs
        run: mkdocs build
